name: Bug 报告
description: 装不上、没反应、行为不对
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先看 [KNOWN_ISSUES.md](https://github.com/Coomusk/qq-xiaoyu/blob/main/KNOWN_ISSUES.md)——
        5 个红的回归套件与已知限制都记在那里，可能已经有答案。

        **不要贴真实 QQ 号、群号、聊天原文、token。** 需要贴日志时先脱敏。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 一句话说清楚现象
      placeholder: QQ 上发消息完全没反应，日志停在这一行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 DSH
        2. npm start
        3. 在群里 @ 机器人
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: package.json 的 version，或 git commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options: [chat, closed-agent, reserved, reserved2, 不确定]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统、Node 版本、DSH 版本、SnowLuma 版本
      placeholder: Windows 11 / Node 22.23.2 / DSH 0.2.1-rc.2 / SnowLuma 1.14.20
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（已脱敏）
      description: state/bridge.log 的尾部；请删掉 QQ 号、群号、路径里的用户名
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我读过 RULES.md 与 KNOWN_ISSUES.md
          required: true
        - label: 日志和截图里的个人信息已脱敏
          required: true
