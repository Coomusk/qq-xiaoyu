name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: 离线回归
    # 这个项目的运行面是 Windows（SnowLuma 的 hook、守护与重启脚本都是 PowerShell），
    # 所以回归也跑在 Windows 上——Linux 上缺 ffmpeg/路径语义不同，红得没有信息量。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 33/35 通过、2 个由 KNOWN_RED 隔离（见 KNOWN_ISSUES.md）。
      # 新增的失败会让这一步红；修好一个已知红就从 scripts/test-audit.mjs 的 KNOWN_RED 里删掉。
      - name: npm run test:audit
        run: npm run test:audit
      - name: 文档相对链接
        run: node scripts/check-doc-links.mjs
      - name: 源码语法
        shell: pwsh
        run: |
          $failed = @()
          git ls-files '*.js' '*.mjs' | ForEach-Object {
            node --check $_
            if ($LASTEXITCODE -ne 0) { $failed += $_ }
          }
          if ($failed) { $failed | ForEach-Object { Write-Error "语法错误：$_" }; exit 1 }
          Write-Host "全部 JS 语法通过"

  hygiene:
    name: 仓库卫生
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 隐私扫描（挡真实 QQ 号 / 本机路径 / 令牌）
        run: node scripts/privacy-scan.mjs --tracked-only
      - name: 禁止提交的文件
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object {
            $_ -match '^(config\.json|state/|audio/|node_modules/)' -or $_ -match '\.bak(-|$)'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error::禁止提交：$_" }
            exit 1
          }
          Write-Host "没有禁止提交的文件"
      - name: PowerShell 语法
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem tools,scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err)
            if ($err -and $err.Count) { $failed += "$($_.Name): $($err[0].Message)" }
          }
          if ($failed) { $failed | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "所有 .ps1 解析通过"
